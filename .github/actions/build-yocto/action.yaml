name: Build Yocto demo image
description: Stage Yocto build artifacts into a Docker image and push it to Docker Hub

inputs:
  arch:
    description: Target Docker architecture (amd64 or arm64)
    required: true
  yocto-arch:
    description: Yocto/kas architecture (x86-64 or arm64)
    required: true
  release:
    description: qbee-agent release used to tag the image
    required: true
  docker-username:
    description: Docker Hub username
    required: true
  docker-password:
    description: Docker Hub password
    required: true

runs:
  using: composite
  steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build-artifacts-${{ inputs.yocto-arch }}
        path: artifacts

    - name: Stage images for Docker build
      shell: bash
      run: |
        set -eu
        rm -rf yocto/images && mkdir -p yocto/images
        case "${{ inputs.arch }}" in
          amd64)
            mv artifacts/core-image-minimal-qemux86-64.rootfs.wic yocto/images/vmimage.wic
            mv artifacts/ovmf.qcow2 yocto/images/ ;;
          arm64)
            mv artifacts/core-image-minimal-qemuarm64.rootfs.wic yocto/images/vmimage.wic
            mv artifacts/bootenv.img artifacts/u-boot.bin yocto/images/ ;;
        esac
        ls -l yocto/images

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./yocto
        file: ./yocto/Dockerfile
        platforms: linux/${{ inputs.arch }}
        push: true
        tags: |
          qbeeio/qbee-demo:latest-yocto-${{ inputs.arch }}
          qbeeio/qbee-demo:${{ inputs.release }}-yocto-${{ inputs.arch }}
