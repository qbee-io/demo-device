permissions:
  contents: read
name: meta-qbee-pr-tests
on:
    pull_request:
jobs:
  build:
    strategy:
      matrix:
        arch: [x86-64,arm64]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 600
    container:
      image: ghcr.io/siemens/kas/kas:5.0-debian-bookworm
      options: --user 1000:1000
      env:
        KAS_CLONE_DEPTH: 0
        DL_DIR: /ci/demo-device/downloads
        SSTATE_DIR: /ci/demo-device/${{ matrix.arch }}/sstate
        TMPDIR: /ci/demo-device/${{ matrix.arch }}/tmp
        # Environment variable for bootstrap key
        # set it to empty for testing purposes
        QBEE_BOOTSTRAP_KEY:
      volumes:
        - /home/runner/ci/demo-device:/ci/demo-device
        - /etc/passwd:/etc/passwd:ro
        - /etc/group:/etc/group:ro

    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: clean target state
        run: | 
          kas shell -c "bitbake -fc do_cleansstate core-image-minimal qbee-agent" kas/kas-qbee-${{ matrix.arch }}.yml
          kas shell -c "bitbake -fc clean core-image-minimal qbee-agent" kas/kas-qbee-${{ matrix.arch }}.yml

      - name: Run kas for ${{ matrix.arch }}
        run: kas build kas/kas-qbee-${{ matrix.arch }}.yml

      - name: Collect build artifacts
        env:
          BUNDLE_ONLY: "false"
        run: &collect |
          set -eu
          deploy=/ci/demo-device/${{ matrix.arch }}/tmp/deploy/images/qemu${{ matrix.arch }}
          out=artifacts/${{ matrix.arch }}
          rm -rf "$out" && mkdir -p "$out"
          bundle="qemu-demo-bundle-qemu${{ matrix.arch }}.raucb"
          case "${{ matrix.arch }}" in
            arm64)
              images="core-image-minimal-qemuarm64.rootfs.wic bootenv.img u-boot.bin" ;;
            x86-64)
              images="core-image-minimal-qemux86-64.rootfs.wic ovmf.qcow2" ;;
          esac
          # -L dereferences the deploy dir symlinks
          if [ "$BUNDLE_ONLY" = "true" ]; then
            # e.g. qemu-demo-bundle-qemux86-64.raucb -> qemu-demo-bundle-nano-qemux86-64.raucb
            cp -L "$deploy/$bundle" "$out/${bundle%-qemu*}-nano-qemu${bundle##*-qemu}"
          else
            for f in $bundle $images; do
              cp -L "$deploy/$f" "$out/"
            done
          fi
          ls -l "$out"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.arch }}
          path: artifacts/${{ matrix.arch }}
          if-no-files-found: error

      - name: Run kas for ${{ matrix.arch }} again with extra package
        run: kas build kas/kas-qbee-${{ matrix.arch }}.yml:kas/kas-qbee-nano.yml

      - name: Collect build artifacts for the second build
        env:
          BUNDLE_ONLY: "true"
        run: *collect

      - name: Upload build artifacts for the second build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-extra-${{ matrix.arch }}
          path: artifacts/${{ matrix.arch }}
          if-no-files-found: error

  docker:
    needs: build
    strategy:
      matrix:
        include:
          - arch: amd64
            yocto-arch: x86-64
            runner: ubuntu-latest
          - arch: arm64
            yocto-arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ matrix.yocto-arch }}
          path: artifacts

      - name: Stage images for Docker build
        run: |
          set -eu
          rm -rf yocto/images && mkdir -p yocto/images
          case "${{ matrix.arch }}" in
            amd64)
              mv artifacts/core-image-minimal-qemux86-64.rootfs.wic yocto/images/vmimage.wic
              mv artifacts/ovmf.qcow2 yocto/images/ ;;
            arm64)
              mv artifacts/core-image-minimal-qemuarm64.rootfs.wic yocto/images/vmimage.wic
              mv artifacts/bootenv.img artifacts/u-boot.bin yocto/images/ ;;
          esac
          ls -l yocto/images

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: get-latest-release
        name: Get latest qbee-agent release
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: qbee-io/qbee-agent
          excludes: prelease,draft

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./yocto
          file: ./yocto/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            qbeeio/qbee-demo:latest-yocto-${{ matrix.arch }}
            qbeeio/qbee-demo:${{ steps.get-latest-release.outputs.release }}-yocto-${{ matrix.arch }}

  docker-manifest:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: get-latest-release
        name: Get latest qbee-agent release
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: qbee-io/qbee-agent
          excludes: prelease,draft

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push multi-arch manifest
        run: |
          LATEST_RELEASE=${{ steps.get-latest-release.outputs.release }}

          docker buildx imagetools create -t qbeeio/qbee-demo:latest-yocto \
            qbeeio/qbee-demo:latest-yocto-amd64 \
            qbeeio/qbee-demo:latest-yocto-arm64

          docker buildx imagetools create -t qbeeio/qbee-demo:${LATEST_RELEASE}-yocto \
            qbeeio/qbee-demo:${LATEST_RELEASE}-yocto-amd64 \
            qbeeio/qbee-demo:${LATEST_RELEASE}-yocto-arm64