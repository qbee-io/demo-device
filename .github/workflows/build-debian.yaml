name: CI Debian

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.get-latest-release.outputs.release }}
    steps:
      - id: get-latest-release
        name: Get latest qbee-agent release
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: qbee-io/qbee-agent
          excludes: prelease,draft

  docker:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            qemu-package: qemu-system-x86
            runner: ubuntu-latest
          - arch: arm64
            qemu-package: qemu-system-arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push image
        uses: ./.github/actions/build-debian
        with:
          arch: ${{ matrix.arch }}
          qemu-package: ${{ matrix.qemu-package }}
          release: ${{ needs.version.outputs.release }}
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}

  docker-manifest:
    needs: [docker, version]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push multi-arch manifest
        env:
          LATEST_RELEASE: ${{ needs.version.outputs.release }}
        run: |
          docker buildx imagetools create -t qbeeio/qbee-demo:latest \
            qbeeio/qbee-demo:latest-amd64 \
            qbeeio/qbee-demo:latest-arm64

          docker buildx imagetools create -t qbeeio/qbee-demo:latest-debian \
            qbeeio/qbee-demo:latest-debian-amd64 \
            qbeeio/qbee-demo:latest-debian-arm64

          docker buildx imagetools create -t qbeeio/qbee-demo:${LATEST_RELEASE}-debian \
            qbeeio/qbee-demo:${LATEST_RELEASE}-debian-amd64 \
            qbeeio/qbee-demo:${LATEST_RELEASE}-debian-arm64

