header:
  version: 14

# Overlay on top of an arch config that adds Docker (moby) and docker compose, e.g.:
#   kas build kas/kas-qbee-x86-64.yml:kas/kas-qbee-docker.yml
#   kas build kas/kas-qbee-arm64.yml:kas/kas-qbee-docker.yml
#
# The daemons and per-container helpers are compressed with UPX in the rootfs
# (see meta-qbee-demo/classes/qbee-demo-upx.bbclass) to fit the fixed-size root partitions.
# All Docker and containerd state lives on the data partition under /data/docker.

repos:
  # branches follow the arch config's defaults
  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
    path: layers/meta-virtualization

local_conf_header:
  docker: |
    # Pulls in the meta-virtualization kernel config fragments (cgroups, overlayfs, netfilter, ...)
    DISTRO_FEATURES:append = " virtualization"
    CONTAINER_PROFILE = "docker"

    IMAGE_INSTALL:append = " docker-moby docker-compose"

    # meta-rauc-qemux86 installs every kernel module (~45M: GPU, sound, wireless, ...), which
    # doesn't fit next to Docker in the 250M root partition. Everything the VM itself needs is
    # built into the kernel; the modules Docker needs are pulled in by docker-moby's RRECOMMENDS.
    IMAGE_INSTALL:remove = "kernel-modules"

    # The udev hardware database (~20M) only provides vendor/model names for devices,
    # which the VM doesn't need; dropped to make room for the uncompressed docker CLIs
    BAD_RECOMMENDATIONS += "udev-hwdb"

    IMAGE_CLASSES += "qbee-demo-upx"
    # docker and docker-compose are left uncompressed so interactive commands don't pay the
    # decompression delay. The daemons (dockerd, containerd, qbee-agent) are unpacked once at
    # boot; runc, the shim and docker-proxy run per container/port and stay compressed only
    # because the 250M root partition has no room for them uncompressed (+~18M).
    UPX_COMPRESS_FILES = " \
        ${bindir}/dockerd \
        ${bindir}/containerd \
        ${bindir}/qbee-agent \
        ${bindir}/runc \
        ${bindir}/containerd-shim-runc-v2 \
        ${bindir}/docker-proxy \
    "

    # Room for images/containers on the data partition (default is 100M)
    QBEE_DEMO_DATA_SIZE = "1024M"
