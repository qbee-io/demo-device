header:
  version: 14

# Passed through from the host environment to bitbake
env:
  QBEE_BOOTSTRAP_KEY: ""

repos:
  meta-qbee:
    url: "https://github.com/qbee-io/meta-qbee.git"
    branch: master
    path: layers/meta-qbee
    layers:
      meta-qbee:

local_conf_header:
  meta-qbee: |
    IMAGE_INSTALL:append = " qbee-agent"
  shared-dirs: |
    # Shared between machine builds; DL_DIR from the kas environment takes precedence
    DL_DIR ?= "${TOPDIR}/../downloads"
    INHERIT += "rm_work"
    RAUC_SLOT_rootfs[fstype] = "ext4"
    RAUC_SLOT_rootfs[adaptive] = "block-hash-index"
    RAUC_BUNDLE_VERSION:forcevariable = "1.0"
    RAUC_BUNDLE_DESCRIPTION:forcevariable = "Version 1.0"

    # DISTRO_CHANGELOG_PATH = "${TOPDIR}/../meta-container-os/files/changelog.txt"
    # INHERIT += "rauc-distro-meta"

    RAUC_META_release_info[ticket] = "NOJIRA-test-ticket"
    RAUC_META_release_info[author] = "qbee.io"

