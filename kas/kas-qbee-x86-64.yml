header:
  version: 14
  includes:
    - kas/kas-qbee.yml

machine: qemux86-64

defaults:
  repos:
    branch: wrynose

repos:
  meta-qbee:
    branch: wrynose
  bitbake:
    branch: "2.18"
  meta-rauc-community:
    url: "https://github.com/rauc/meta-rauc-community.git"
    path: layers/meta-rauc-community
    # no wrynose branch yet; master is wrynose-compatible at this commit
    branch: master
    commit: 4d666ae4956f1cfacbd1a844f2e1794cb7784e2a
    layers:
      meta-rauc-qemux86:

target:
  - core-image-minimal
  - qemu-demo-bundle

local_conf_header:
  machine: |
    EXTRA_IMAGEDEPENDS += "ovmf"
    PREFERRED_RPROVIDER_virtual-grub-bootconf = "rauc-qemu-grubconf"
