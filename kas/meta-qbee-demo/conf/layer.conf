BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Only parsed when the layer they extend is in the build (e.g. kas-qbee-docker.yml)
BBFILES_DYNAMIC += " \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "qbee-demo"
BBFILE_PATTERN_qbee-demo = "^${LAYERDIR}/"
BBFILE_PRIORITY_qbee-demo = "10"

LAYERDEPENDS_qbee-demo = "core rauc"
LAYERSERIES_COMPAT_qbee-demo = "wrynose"

# Demo signing keys - development only
# The meta-rauc-* layers also set these with ?=, so the cert/keyring are forced here
RAUC_KEY_FILE ?= "${LAYERDIR}/files/rauc-demo-keys/demo-1.key.pem"
RAUC_CERT_FILE = "${LAYERDIR}/files/rauc-demo-keys/demo-1.cert.pem"
RAUC_KEYRING_FILE = "${LAYERDIR}/files/rauc-demo-keys/ca.cert.pem"
